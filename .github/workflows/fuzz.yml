name: Fuzz Parser

on:
  pull_request:
    branches:
      - "**"
    paths:
      - "cfml/src/scanner.c"
      - "cfscript/src/scanner.c"
      - "cfquery/src/scanner.c"
      - "common/scanner.h"
      - "common/tag.h"
      # Grammar sources too, not just the scanners. Which external tokens are
      # valid depends on the parse state, so a grammar change can put the
      # scanner somewhere it has never been asked to scan before — and a
      # zero-width token that repeats loops the parser with no scanner edit at
      # all. The job costs ~30s per dialect; a hang costs 15 minutes.
      - "common/define-grammar.js"
      - "cfscript/grammar.js"
      # The fuzzer itself, so a change to it is validated by running it.
      - ".github/workflows/fuzz.yml"
      - "scripts/fuzz.js"
  push:
    branches:
      - "master"
    paths:
      - "cfml/src/scanner.c"
      - "cfscript/src/scanner.c"
      - "cfquery/src/scanner.c"
      - "common/scanner.h"
      - "common/tag.h"
      # Grammar sources too, not just the scanners. Which external tokens are
      # valid depends on the parse state, so a grammar change can put the
      # scanner somewhere it has never been asked to scan before — and a
      # zero-width token that repeats loops the parser with no scanner edit at
      # all. The job costs ~30s per dialect; a hang costs 15 minutes.
      - "common/define-grammar.js"
      - "cfscript/grammar.js"
      # The fuzzer itself, so a change to it is validated by running it.
      - ".github/workflows/fuzz.yml"
      - "scripts/fuzz.js"
  workflow_dispatch:

jobs:
  # Uses the tree-sitter CLI's own fuzzer, the same binary `postinstall`
  # downloads. The previous third-party action built a Docker image that cloned
  # upstream tree-sitter and ran `cargo install --path cli/`; upstream moved that
  # directory, so the image build failed and this workflow was red on every
  # master push from May 2026 onwards without ever fuzzing anything.
  fuzz:
    name: Fuzz ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        language: [cfml, cfscript, cfquery]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm install
      - name: Fuzz ${{ matrix.language }}
        run: npm run fuzz
        env:
          DIALECT: ${{ matrix.language }}
