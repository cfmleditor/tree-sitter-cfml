name: CI
on:
  workflow_dispatch:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - "master"

jobs:
  # `npm test` compiles the *committed* cf*/src/parser.c, so a grammar change
  # that was never regenerated would otherwise pass CI while shipping a stale
  # parser. Regenerate here and compare against what is checked in.
  #
  # Two histories are worth knowing before touching this job.
  #
  # The pathspec read `*/src/` for eleven releases, and matches NOTHING: git's
  # wildcard pathspecs are fnmatch patterns, so a trailing `/` needs a component
  # after it, and only a literal prefix like `cfscript/src` works without one.
  # `git diff --exit-code` over an empty match always exits 0, so this job had
  # been passing without comparing anything. Hence the `ls-files` guard, which
  # now lives in the script — a check that cannot see its own subject is worse
  # than no check, because it reads as green.
  #
  # Fixing that surfaced the second problem: `tree-sitter generate` is not
  # reproducible across machines (#100). Identical grammar, identical CLI,
  # equivalent tables — different state numbering, and a diff of hundreds of
  # thousands of lines. Failing on that punishes a contributor for their CPU.
  # So the comparison is classified rather than binary: a stale parser fails,
  # a renumbering warns and CI publishes its own output as the canonical copy.
  generated:
    name: Generated parsers up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm install
      - name: Regenerate parsers
        run: |
          DIALECT=cfml npm run build
          DIALECT=cfscript npm run build
          DIALECT=cfquery npm run build
      - name: Classify drift
        run: node scripts/check-generated.js --explain
      # CI is the authority for what the generated sources should look like, so
      # publish them whenever they differ at all — on a renumbering the job has
      # passed and this is how a contributor adopts CI's numbering; on a failure
      # it is the quickest way to see what the job actually produced.
      - name: Did anything differ?
        id: publish
        if: always()
        run: |
          git diff --quiet -- '*/src/*' || echo "publishing=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always() && steps.publish.outputs.publishing == 'true'
        with:
          name: generated-parsers
          path: |
            cfml/src/
            cfquery/src/
            cfscript/src/
          retention-days: 14

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm install
      - run: npm test
      # The probes are minimal reductions of constructs found in real CFML, with
      # their current pass/fail status committed in test/probes/expected.json.
      # This fails on drift in either direction, so a gap closing is as loud as a
      # regression — but only if it actually runs, which until now it did not.
      - run: npm run probe
      # `examples/` was scanned by nothing — not a script, not a workflow, and
      # eslint ignored it — so the fact that both its files segfault the parser
      # (#57) went unnoticed. It runs isolated (a process per file) because an
      # in-process scan dies with the parser, and against a committed baseline
      # so the known crashes do not redden CI while any change to them does.
      - run: npm run scan:examples
      - run: npm run testbindings
      - run: npm run lint

  # The Java binding is pure Java: it resolves `tree_sitter_*` out of shared
  # libraries at runtime, so nothing here is checked by `npm test`. Build the
  # libraries (grammars plus the tree-sitter runtime vendored by the `tree-sitter`
  # npm package) and parse a sample of each dialect through jtreesitter.
  test_java:
    name: Java binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'
      - run: npm install
      - run: npm run build:native
      # No -Prelease, so the GPG signing and Maven Central steps stay skipped.
      - run: mvn -B --no-transfer-progress test

  test_windows:
    # Pinned, not windows-latest: that image now ships Visual Studio 18, which
    # node-gyp 11.x parses as version "undefined" and then rejects with
    # "could not find a version of Visual Studio 2017 or newer to use", so the
    # native addon fails to build. windows-2022 has VS 17. Revisit once
    # node-gyp recognises VS 18.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm install
      - run: npm test
      - run: npm run probe
      - run: npm run lint
