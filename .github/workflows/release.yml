name: Release

on:
  push:
    tags:
      - "v*"
  # Re-running a tag-push run replays the workflow file *from that tag*, so a
  # release broken by a workflow bug can never be repaired by re-running it —
  # the broken file is what runs again. v0.26.33 reached npm and PyPI but not
  # crates.io for exactly that reason. Dispatching instead runs the workflow as
  # it exists on the branch you dispatch from, against the tag you name, which
  # is the only way to apply a workflow fix to an already-tagged release.
  #
  # Safe to run against a fully published tag: every publish below skips a
  # version already on its registry, so a dispatch that has nothing to do
  # reports skips rather than failing or republishing.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.26.33"
        required: true
        type: string

jobs:
  build-wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Build sdist
        run: |
          python -m pip install build
          python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish-pypi:
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Same reasoning as the npm and crates.io guards below: a dispatch
          # aimed at a partly-published tag must be able to walk past what
          # already shipped instead of failing on it.
          skip-existing: true

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # crates.io publishes through Trusted Publishing, which exchanges this
      # job's OIDC identity for a short-lived registry token. Without it the
      # exchange fails and the release falls back to CARGO_REGISTRY_TOKEN.
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Extract changelog notes
        id: changelog
        env:
          # On a dispatch, GITHUB_REF_NAME is the branch dispatched from rather
          # than the tag, so the version has to come from the input instead.
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md)
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # Pinned rather than read from .nvmrc, which every other job uses.
          # This job checks out the *tag*, so node-version-file would take the
          # toolchain the release was cut with — and re-driving v0.26.33 did
          # exactly that, landing on the Node 22 it was tagged with, whose npm
          # 10.9.8 predates trusted publishing. The code being published comes
          # from the tag; the toolchain doing the publishing must not.
          node-version: 24
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm install

      # Every credential is checked before anything is published. This job is a
      # sequence of one-way publishes, so a token that turns out to be bad
      # part-way through leaves the version on some registries and not others,
      # and re-running cannot repair it because the publishes that already
      # succeeded now collide with themselves. That is how 0.26.33 reached npm
      # and PyPI but not crates.io: only npm's credentials were checked, npm
      # went out first, and the crates.io token was rejected immediately after.
      - name: Verify npm credentials
        env:
          NPM_FALLBACK_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # npm gained OIDC trusted publishing in 11.5.0. Node 22 bundles npm
          # 10.9.8, which is why .nvmrc moved to 24 (npm 11.16+). Checked here
          # because the failure mode otherwise is silent: an old npm ignores
          # OIDC, quietly authenticates with NPM_TOKEN, and trusted publishing
          # looks configured while never being used.
          need=11.5.2
          have=$(npm --version)
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -n1)" != "$need" ]; then
            echo "npm $have is too old for trusted publishing (need >= $need)." >&2
            exit 1
          fi
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "OIDC available; npm publish will use trusted publishing."
          elif [ -n "$NPM_FALLBACK_TOKEN" ]; then
            echo "::warning::No OIDC token endpoint; falling back to NPM_TOKEN."
            NODE_AUTH_TOKEN="$NPM_FALLBACK_TOKEN" npm whoami
          else
            echo "No npm credential: no OIDC token endpoint and NPM_TOKEN is unset." >&2
            exit 1
          fi

      # The OIDC exchange runs here rather than next to the publish, so that a
      # misconfigured trusted publisher is discovered before npm has shipped.
      # It is allowed to fail: CARGO_REGISTRY_TOKEN is kept as a fallback, and
      # the check below is what decides whether either credential works.
      - name: Exchange OIDC for a crates.io token
        id: crates_auth
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@v1

      - name: Verify crates.io credentials
        env:
          # Trusted publishing first, the stored token second. Whichever wins
          # here is the one the publish step uses, so this checks what will
          # actually be used rather than what we hope will be.
          CRATES_TOKEN: ${{ steps.crates_auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ "${{ steps.crates_auth.outcome }}" = "success" ]; then
            echo "Using a trusted-publishing token."
          else
            echo "::warning::Trusted publishing did not yield a token;" \
                 "falling back to CARGO_REGISTRY_TOKEN."
          fi
          if [ -z "$CRATES_TOKEN" ]; then
            echo "No crates.io credential: trusted publishing produced nothing" >&2
            echo "and CARGO_REGISTRY_TOKEN is unset." >&2
            exit 1
          fi
          # `cargo publish --dry-run` does not authenticate, so ask the registry
          # directly. 200 means the credential is valid and unexpired.
          # Not named `status`: that is read-only in some shells, which turns a
          # credential check into a spurious job failure.
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: $CRATES_TOKEN" \
            --header "User-Agent: tree-sitter-cfml release workflow" \
            https://crates.io/api/v1/me)
          if [ "$code" != "200" ]; then
            echo "crates.io rejected the credential (HTTP $code)." >&2
            echo "Check the trusted publisher for this repository and" >&2
            echo "release.yml at https://crates.io/crates/tree-sitter-cfml/settings," >&2
            echo "or regenerate CARGO_REGISTRY_TOKEN with publish-update scope." >&2
            exit 1
          fi
          echo "crates.io credentials OK."

      # The publishes below skip a version that is already on the registry
      # rather than failing on it, so a re-run after a later step failed can
      # walk past what already succeeded and reach the step that did not.
      # Without this, the only way out of a half-published release is to burn a
      # version number.
      - name: Publish to npm
        env:
          NPM_FALLBACK_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; skipping."
          else
            # The token is supplied only when OIDC is unavailable. npm prefers
            # NODE_AUTH_TOKEN when it is set and never attempts the exchange, so
            # passing it unconditionally would shadow trusted publishing with
            # the very credential this repo has moved away from.
            if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
              export NODE_AUTH_TOKEN="$NPM_FALLBACK_TOKEN"
            fi
            npm publish
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check whether this version is on crates.io
        id: crate
        run: |
          version=$(node -p 'require("./package.json").version')
          if curl --silent --fail \
               --header "User-Agent: tree-sitter-cfml release workflow" \
               https://crates.io/api/v1/crates/tree-sitter-cfml/versions \
             | jq -e --arg v "$version" '.versions[] | select(.num == $v)' >/dev/null; then
            echo "tree-sitter-cfml $version is already on crates.io; skipping."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to crates.io
        if: steps.crate.outputs.published == 'false'
        uses: katyo/publish-crates@v2
        with:
          # Same expression the verify step checked, so the credential that was
          # tested is the credential that publishes.
          registry-token: ${{ steps.crates_auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # `tag_name` must be explicit. On a tag push the action infers it from
          # the ref, but on a dispatch that ref is the branch, so without this it
          # would cut a release against the branch instead of the tag. The
          # action updates an existing release rather than failing, which is
          # what makes a dispatch at an already-released tag harmless.
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          body: ${{ steps.changelog.outputs.notes }}

  # Off by default, so a tag push cannot fail on credentials that do not exist
  # yet. Turning it on needs, once: the io.github.cfmleditor namespace verified
  # on Maven Central, the four secrets below, and the repository variable
  # PUBLISH_MAVEN set to 'true'. Until then the Java binding is built from
  # source (`npm run build:native && mvn test`) rather than consumed from a
  # published artifact.
  publish-maven:
    name: Publish to Maven Central
    if: vars.PUBLISH_MAVEN == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "maven"
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # The tests load the grammars out of shared libraries, so build those first.
      - name: Build native libraries
        run: |
          npm install
          npm run build:native

      - name: Publish
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn -B --no-transfer-progress -Prelease deploy
